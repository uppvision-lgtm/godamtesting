# Stack lengkap untuk VPS yang berdiri sendiri (auto-comment.tech).
# Berbeda dari sandbox Vercel + Railway + Supabase: di sini semuanya —
# frontend, backend, antrean, database, dan penyimpanan berkas — jalan di
# mesin yang sama dan tidak bergantung layanan luar.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Database akun pengguna. Menggantikan peran Supabase di sandbox.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-godam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env}
      POSTGRES_DB: ${POSTGRES_DB:-godam}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Hanya dijalankan sekali, saat volume masih kosong.
      - ./deploy/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-godam} -d ${POSTGRES_DB:-godam}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Menyulap Postgres jadi REST API yang bentuknya sama dengan Supabase,
  # sehingga backend/db.py bisa memakai keduanya tanpa cabang kode.
  postgrest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-godam}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-godam}
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_SERVER_PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
    # Sengaja hanya "expose", bukan "ports": tidak pernah terbuka ke internet.
    expose:
      - "3000"

  backend:
    image: ${BACKEND_IMAGE:-instagram-automation-backend:local}
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      LIVE_HEADLESS: "true"
      COMMENT_STATE_DIR: /data/comment-state
      # Template dan video hasil render. Wajib menunjuk ke volume, kalau tidak
      # semuanya hilang setiap kali container dibuat ulang.
      MEDIA_DIR: /data/media
      # Database sendiri, bukan Supabase.
      DB_REST_URL: http://postgrest:3000
      AUTH_ALLOW_REGISTER: ${AUTH_ALLOW_REGISTER:-true}
      AUTH_USERNAME: ${AUTH_USERNAME:-}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-}
      DEBUG: ${DEBUG:-false}
      FRONTEND_URL: ${FRONTEND_URL:-https://auto-comment.tech,https://www.auto-comment.tech}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RATE_LIMIT_PER_IP_PER_DAY: ${RATE_LIMIT_PER_IP_PER_DAY:-10}
      PLAYWRIGHT_TIMEOUT_MS: ${PLAYWRIGHT_TIMEOUT_MS:-10000}
      PLAYWRIGHT_NAVIGATION_TIMEOUT_MS: ${PLAYWRIGHT_NAVIGATION_TIMEOUT_MS:-30000}
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-1}
    volumes:
      - comment-state:/data/comment-state
      - media:/data/media
    depends_on:
      redis:
        condition: service_healthy
      postgrest:
        condition: service_started
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 40s

  frontend:
    image: ${FRONTEND_IMAGE:-instagram-automation-frontend:local}
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_API_URL: http://backend:8000
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-admin@auto-comment.tech}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend

volumes:
  redis-data:
  postgres-data:
  comment-state:
  media:
  caddy-data:
  caddy-config:
