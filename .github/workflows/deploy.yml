# ============================================================================
#  REPO INI ADALAH SANDBOX UJI COBA (uppvision-lgtm/godamtesting).
#
#  Workflow deploy SENGAJA DILUMPUHKAN.
#
#  Repo produksi https://github.com/uppvision-lgtm/godam yang men-deploy ke
#  https://auto-comment.tech/ — server itu harus hidup 24 jam dan tidak boleh
#  mati sedetik pun. Karena itu repo testing ini tidak boleh punya jalur apa
#  pun menuju VPS tersebut.
#
#  Pengaman yang dipasang:
#    1. Tidak ada trigger 'push' — hanya bisa dijalankan manual.
#    2. Job utama di-guard 'if: false' sehingga tidak pernah berjalan.
#    3. Tidak ada satu pun referensi ke secrets VPS_HOST / VPS_USER /
#       VPS_SSH_KEY, jadi menambahkan secrets itu pun tidak mengaktifkan apa-apa.
#    4. GitHub Actions di repo ini juga dimatikan di level Settings.
#
#  JANGAN mengembalikan isi file ini dari repo godam.
# ============================================================================

name: Deploy VPS (DIMATIKAN di repo testing)

on:
  workflow_dispatch:

jobs:
  penjelasan:
    name: Deploy dimatikan
    runs-on: ubuntu-latest
    steps:
      - name: Kenapa tidak ada deploy
        run: |
          echo "Repo godamtesting tidak melakukan deploy."
          echo "Deploy ke auto-comment.tech hanya boleh dari repo godam."
          exit 0

  deploy:
    name: SSH deploy (tidak pernah jalan)
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Dinonaktifkan permanen di repo testing."
